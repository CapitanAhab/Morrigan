<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&amp;family=Jost:wght@300;400;500&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#C3CDD8}a:hover{color:#F1F4F7}
.arrive{animation:arrive .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
.thread{fill:none;stroke:#9ED8E8;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(126,200,226,.8))}
.th1{animation:draw .5s cubic-bezier(.5,0,.2,1) .1s forwards}
.th2{animation:draw .6s cubic-bezier(.5,0,.2,1) .55s forwards}
.tdot{opacity:0;animation:fadein .4s ease 1.1s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes fadein{to{opacity:1}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes turn{to{transform:rotate(360deg)}}
.back-node .bdot{transition:transform .3s,box-shadow .3s}
.back-node:hover .bdot,.back-node:focus-visible .bdot{transform:scale(1.4);box-shadow:0 0 0 5px rgba(158,216,232,.14),0 0 16px rgba(126,200,226,.9)}
.flipper{transition:transform .85s cubic-bezier(.2,.7,.2,1);transform-style:preserve-3d}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:8px;overflow:hidden}
.glint rect{fill:none;stroke:#EAF4F6;stroke-width:2;stroke-linecap:round;stroke-dasharray:.14 .86;stroke-dashoffset:1;filter:drop-shadow(0 0 4px rgba(158,216,232,1));animation:glint 1.1s cubic-bezier(.4,0,.2,1) .3s forwards;opacity:0}
@keyframes glint{0%{stroke-dashoffset:1;opacity:0}10%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-.02;opacity:0}}
.reveal-text{animation:arrive .6s cubic-bezier(.2,.7,.2,1) .3s both}

/* letras del anillo */
.ltr text{fill:#4A6078;transition:fill .6s ease,opacity .8s ease}
.ltr text.num{fill:#2C3D52}
.open .ltr{opacity:0;transition:opacity 1s ease .4s}
.ring-on .ltr text{fill:#7C8DA1}
.ring-on .ltr text.num{fill:#41546B}
.at-index{fill:#E4EAF0 !important}
/* pista: una línea recorre el anillo y roza E, L, F */
.hintsweep{fill:none;stroke:#EAF4F6;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:.03 .97;stroke-dashoffset:1;opacity:0;filter:drop-shadow(0 0 3px rgba(94,214,182,.9))}
.locked .hintsweep{animation:hsweep 13s ease-in-out 3.5s infinite}
@keyframes hsweep{0%{stroke-dashoffset:1;opacity:0}3%{opacity:.8}26%{opacity:.8}30%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
.locked .key-e{animation:keyhint 13s ease-in-out 4.1s infinite}
.locked .key-l{animation:keyhint 13s ease-in-out 4.7s infinite}
.locked .key-f{animation:keyhint 13s ease-in-out 5.3s infinite}
@keyframes keyhint{0%,100%{fill:#4A6078}2%{fill:#5ED6B6}6%{fill:#4A6078}}

/* la perilla respira mientras la tocás */
.kb{opacity:0;transition:opacity .5s ease}
.k-on .kb{opacity:1}
.k-on .kw1{animation:turn 9s linear infinite}
.k-on .kw2{animation:turn 12s linear infinite reverse}
.kwave{fill:none;stroke:#DDE6EE;opacity:0}
.k-on .kwave{animation:kwave 2.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes kwave{0%{r:31px;opacity:.5}60%{r:58px;opacity:0}100%{r:58px;opacity:0}}
.kring{transition:stroke .5s ease,fill .5s ease,filter .5s ease}
.k-small .kwave{animation-duration:4.4s}
.k-small .kw1{animation-duration:16s}
.k-small .kw2{animation-duration:22s}
.knob{transition:transform 1.1s cubic-bezier(.5,0,.2,1) .9s}
.reset .kring{animation:shake .35s ease}
@keyframes shake{25%{transform:translateX(-1.5px)}75%{transform:translateX(1.5px)}}

/* apertura: la onda despierta todo */
.openwave{fill:none;stroke:#DDE6EE;opacity:0}
.opening .openwave{animation:openwave 1.8s cubic-bezier(.2,.6,.3,1) forwards}
.opening .openwave.w2{animation-delay:.25s}
.opening .openwave.w3{animation-delay:.5s}
@keyframes openwave{0%{r:40px;opacity:.75;stroke-width:1.6}100%{r:620px;opacity:0;stroke-width:.3}}

@media (prefers-reduced-motion: reduce){
  .arrive,.th1,.th2,.tdot,.reveal-text,.glint rect,.locked .hintsweep,.locked .key-e,.locked .key-l,.locked .key-f,.k-on .kw1,.k-on .kw2,.k-on .kwave,.opening .openwave{animation:none}
  .thread{stroke-dashoffset:0}.tdot{opacity:1}
  .flipper,.dial,.ring,.lev,.knob{transition:none !important}
  .floaty{animation:none !important}
}
</style>

        aria: !open ? 'Card ' + (k + 1) + ', sealed' : on ? (seen[k] ? (k + 1) + ', ' + c.position + ', ' + c.name : 'Turn over card ' + (k + 1)) : 'Bring card ' + (k + 1) + ' to the center'
      };
    });

    const active = !!st.knobActive || dragging || lockLive !== null;
    const WHITE = '#F1F4F7', WGLOW = 'drop-shadow(0 0 3px rgba(234,244,246,.85))';
    const lit = (n) => (step >= n || open) ? WHITE : (active ? '#7F90A4' : '#3E5268');
    const litGlow = (n) => (step >= n || open) ? WGLOW : 'none';
    const lockDragging = lockLive !== null;

    return {
      rootCls: (open ? 'open' : 'locked') + (opening ? ' opening' : '') + (st.resetting ? ' reset' : ''),
      cards, c: CARDS[sel], isOpen: open, revealed: open && !opening && !!seen[sel] && !dragging,
      dialRot: (-pos * STEP) + 'deg',
      dialTrans: dragging ? 'none' : 'transform .95s cubic-bezier(.3,.7,.2,1)',
      ringRot: open ? (-pos * STEP) + 'deg' : curRot + 'deg',
      ringTrans: (dragging || lockDragging) ? 'none' : (opening ? 'transform 1.6s cubic-bezier(.5,0,.2,1)' : 'transform .5s cubic-bezier(.3,.7,.2,1)'),
      knobRot: open ? (-(pos - 2) * KSTEP) + 'deg' : (curRot / GEAR) + 'deg',
      knobTrans: (dragging || lockDragging) ? 'none' : 'transform .5s cubic-bezier(.3,.7,.2,1)',
      knobPlace: open ? 'translate(0px, 204px) scale(.4)' : 'none',
      knobCls: open ? 'k-on k-small' : (active ? 'k-on' : ''),
      ringCls: active && !open ? 'ring-on' : '',
      ring1: lit(1), ring2: lit(2), ring3: lit(3),
      ring1Glow: litGlow(1), ring2Glow: litGlow(2), ring3Glow: litGlow(3),
      kLine: open ? '#B9C6D3' : (active ? '#7F90A4' : '#2E4058'),
      kCore: (open || active) ? WHITE : '#3E5268',

      threadEnd: open ? '198' : '206',
      caretY: open ? '199' : '209',
      caretTip: open ? '204' : '216',
      knobLabel: open ? 'Story dial, card ' + (sel + 1) + ' of 5. Turn to move between cards' : 'Lock dial, at ' + slotLabel(atIndex) + '. Turn left and right to open',
      dDown, dMove, dUp, kDown, kMove, kUp, kKey, wheel,
      lc: Object.fromEntries(LETTERS.map((L, n) => [L, (!open && n === atIndex) ? 'at-index' : '']))
    };
  }
}
</script>
</body>
