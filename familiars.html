<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}

/* A alimenta D: el hilo baja y toca el círculo */
.arrive{animation:arrive .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
.thread{fill:none;stroke:#9ED8E8;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(126,200,226,.8))}
@keyframes draw{to{stroke-dashoffset:0}}
.th1{animation:draw .5s cubic-bezier(.5,0,.2,1) .1s forwards}
.th2{animation:draw .5s cubic-bezier(.5,0,.2,1) .55s forwards}
.drawn{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.6s cubic-bezier(.45,0,.25,1) forwards}
.fade{opacity:0;animation:fadein .8s ease forwards}
@keyframes fadein{to{opacity:1}}
.back-node .bdot{transition:transform .3s,box-shadow .3s}
.back-node:hover .bdot,.back-node:focus-visible .bdot{transform:scale(1.4);box-shadow:0 0 0 5px rgba(158,216,232,.14),0 0 16px rgba(126,200,226,.9)}

/* lo de A: luces que recorren y puntas que parpadean, de a poco */
.sweep{fill:none;stroke:#EAF4F6;stroke-width:1.3;stroke-linecap:round;stroke-dasharray:.04 .96;stroke-dashoffset:1;opacity:0;filter:drop-shadow(0 0 3px rgba(176,215,222,.9))}
.sweep-a{animation:sweep 12s ease-in-out 3.5s infinite}
.sweep-b{stroke-dasharray:.05 .95;animation:sweep-rev 17s ease-in-out 9s infinite}
@keyframes sweep{0%{stroke-dashoffset:1;opacity:0}4%{opacity:.8}28%{opacity:.8}32%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes sweep-rev{0%{stroke-dashoffset:0;opacity:0}4%{opacity:.55}24%{opacity:.55}28%{stroke-dashoffset:1;opacity:0}100%{stroke-dashoffset:1;opacity:0}}
.twinkle{fill:#DDE6EE;opacity:0;animation:twinkle 7s ease-in-out infinite}
@keyframes twinkle{0%,100%{opacity:0}50%{opacity:.4}}

/* nodos */
.node .dot{transition:transform .35s cubic-bezier(.3,1.4,.5,1),background .4s,box-shadow .4s}
.node.idle .dot{animation:blink 11s ease-in-out infinite}
@keyframes blink{0%,90%,100%{box-shadow:none}94%{box-shadow:0 0 0 3px rgba(234,244,246,.12),0 0 12px rgba(234,244,246,.7)}}
.node.sel .dot{transform:scale(1.35)}
.node.hit .dot{transform:scale(1.5)}
.node .halo{fill:none;stroke:#9ED8E8;stroke-width:1;opacity:0;transition:opacity .6s}
.node.on .halo{opacity:.7}
.node .guide{fill:none;stroke:#EAF4F6;stroke-width:1;opacity:0}
.node.next .guide{animation:guide 1.1s ease-in-out infinite}
@keyframes guide{0%,100%{opacity:0;r:9px}50%{opacity:.9;r:15px}}
.node:focus-visible .dot{box-shadow:0 0 0 4px rgba(158,216,232,.25)}

/* el trazo: tinta blanca, como el ensō */
.trace{fill:none;stroke:#E6EDF3;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;opacity:.92;filter:drop-shadow(0 0 1.5px rgba(230,237,243,.45));transition:opacity .2s}
.trace-bleed{fill:none;stroke:#DDE6EE;stroke-width:6;stroke-linecap:round;stroke-linejoin:round;opacity:.08;filter:blur(2px)}
.fizzle .trace{animation:dry .9s ease forwards}
.fizzle .trace-bleed{animation:drybleed .9s ease forwards}
@keyframes dry{0%{opacity:.9;stroke-width:2.6}40%{opacity:.6;stroke-width:1.6}100%{opacity:0;stroke-width:.3}}
@keyframes drybleed{to{opacity:0}}
.sealed .trace{animation:inklight 1.9s ease forwards}
@keyframes inklight{0%{opacity:.95;stroke:#E6EDF3}30%{opacity:1;stroke:#BFEAF4;stroke-width:3}100%{opacity:0;stroke:#9ED8E8;stroke-width:1.2}}
.sealed .trace-bleed{animation:drybleed 1.2s ease forwards}
.ripple{fill:none;stroke:#9ED8E8;opacity:0}
.sealed .ripple{animation:ripple 1.5s cubic-bezier(.2,.6,.3,1)}
.sealed .ripple.r2{animation-delay:.22s}
@keyframes ripple{0%{r:60px;opacity:.75;stroke-width:1.4}100%{r:200px;opacity:0;stroke-width:.3}}
.ringlit{fill:none;stroke:#9ED8E8;stroke-width:1.3;stroke-dasharray:1;stroke-dashoffset:1;opacity:0;filter:drop-shadow(0 0 3px rgba(126,200,226,.9))}
.sealed .ringlit{animation:ringlit 1.8s cubic-bezier(.45,0,.25,1)}
@keyframes ringlit{0%{stroke-dashoffset:1;opacity:1}55%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}

/* mantener el centro: despedir */
.breath{opacity:0;transition:opacity .45s ease}
.cholding .breath{opacity:1}
.bw{fill:none;stroke:#DDE6EE;stroke-width:1;transform-origin:195px 318px}
.bw1{stroke-opacity:.5}.bw2{stroke-opacity:.28}
.cholding .bw1,.dismissed .bw1{animation:turn 9s linear infinite}
.cholding .bw2,.dismissed .bw2{animation:turn 12s linear infinite reverse}
@keyframes turn{to{transform:rotate(360deg)}}
.bshrink{transform-origin:195px 318px;transition:transform .5s ease}
.cholding .bshrink{transform:scale(.62);transition:transform 3s cubic-bezier(.5,0,.8,.5)}
/* al soltarse, lo que venía cerrándose termina de cerrarse sobre el centro */
.dismissed .breath{transition:opacity .3s ease .45s}
.dismissed .bshrink{transform:scale(.04);transition:transform .7s cubic-bezier(.55,0,.8,.4)}
/* las ondas entran hacia el portal, cada vez más seguido: ella lo está llamando de vuelta */
.inhale{fill:none;stroke:#DDE6EE;opacity:0}
.cholding .inhale{animation-name:inhale;animation-timing-function:cubic-bezier(.4,0,.7,1);animation-fill-mode:both}
@keyframes inhale{0%{r:124px;opacity:0;stroke-width:.3}35%{opacity:.5}100%{r:var(--to,60px);opacity:0;stroke-width:1.1}}
/* la despedida: tres círculos finos se cierran en un punto, queda una chispa y se apaga */
.close{fill:none;stroke:#DDE6EE;opacity:0}
.dismissed .close{animation:closein .75s cubic-bezier(.55,0,.8,.4)}
.dismissed .close.c2{animation-delay:.13s}
.dismissed .close.c3{animation-delay:.26s}
@keyframes closein{0%{r:128px;opacity:0;stroke-width:.4}25%{opacity:.75}100%{r:3px;opacity:0;stroke-width:1.2}}
.spark{fill:#EAF4F6;opacity:0;filter:drop-shadow(0 0 4px rgba(158,216,232,.95))}
.dismissed .spark{animation:spark .85s ease-out .62s}
@keyframes spark{0%{opacity:0;r:.5px}18%{opacity:1;r:2.6px}45%{opacity:.9;r:1.6px}100%{opacity:0;r:.4px}}

/* constelaciones en el portal */
/* motas de luz que suben muy lento */
.motes{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.mote{position:absolute;border-radius:50%;opacity:0;animation-name:moteup,motesway;animation-timing-function:linear,ease-in-out;animation-iteration-count:infinite,infinite;animation-direction:normal,alternate}
@keyframes moteup{0%{transform:translateY(0);opacity:0}12%{opacity:var(--o)}80%{opacity:var(--o)}100%{transform:translateY(-560px);opacity:0}}
@keyframes motesway{from{margin-left:-7px}to{margin-left:7px}}
/* al sellar, la tinta del círculo sube hacia la figura */
.inkrise circle{opacity:0}
.sealed .inkrise circle{animation-name:inkrise;animation-timing-function:cubic-bezier(.3,.1,.3,1);animation-fill-mode:both}
@keyframes inkrise{0%{opacity:0;transform:translate(0,0)}18%{opacity:.85}100%{opacity:0;transform:translate(var(--dx),var(--dy))}}
/* el círculo: un ensō de tinta, un bisel preciso afuera, arcos que giran adentro */
.enso{opacity:.82}
.enso-paint{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.5s cubic-bezier(.55,0,.25,1) .9s forwards}
.splat circle{transition:opacity .4s}
.bezel{transform-origin:195px 318px}
.bezel path{transform-origin:195px 318px;animation:turn 140s linear infinite}
.arcs .a1{transform-origin:195px 318px;animation:turn 70s linear infinite}
.arcs .a2{transform-origin:195px 318px;animation:turn 95s linear infinite reverse}
/* la estrella escondida: aparece solo mientras la trazás */
.star{fill:none;stroke:#8E9FB2;stroke-width:.9;stroke-linejoin:round;stroke-dasharray:1;stroke-dashoffset:1;transition:opacity .5s ease}
.tracing .star{animation:draw .9s cubic-bezier(.45,0,.25,1) forwards}
.sealed .star{stroke-dashoffset:0;animation:starlit 1.8s ease forwards}
@keyframes starlit{0%{stroke:#EAF4F6;opacity:.9;filter:drop-shadow(0 0 4px rgba(158,216,232,.9))}100%{stroke:#9ED8E8;opacity:0}}
/* el familiar invocado respira, como Morrigan dormida en A */
.sbreath{opacity:0;transition:opacity .9s ease}
.summoned .sbreath{opacity:1}
.cholding .sbreath{opacity:0;transition:opacity .4s ease}
.swv{fill:none;stroke:#DDE6EE;stroke-width:1}
.sring{transform-origin:195px 318px}
.summoned .sring{animation:sbreath 4.6s ease-in-out 1.6s infinite}
@keyframes sbreath{0%,100%{transform:scale(.97);opacity:.35}50%{transform:scale(1.03);opacity:.8}}
.swv1,.swv2{transform-origin:195px 318px}
.summoned .swv1{animation:turn 26s linear infinite}
.summoned .swv2{animation:turn 33s linear infinite reverse}
.ssonar{fill:none;stroke:#DDE6EE;opacity:0}
.summoned .ssonar{animation:ssonar 4.6s cubic-bezier(.2,.6,.3,1) 1.6s infinite}
@keyframes ssonar{0%{r:100px;opacity:.4;stroke-width:1}48%{r:172px;opacity:0;stroke-width:.3}100%{r:172px;opacity:0}}
/* el familiar: una imagen en tinta clara */
.fam{opacity:0;filter:blur(9px);transform:scale(.95);pointer-events:none;transform-origin:var(--ox,50%) var(--oy,50%);transition:opacity .7s ease,filter .9s ease,transform 1s ease}
.fam.show{opacity:.2;filter:blur(0);transform:none;transition:opacity 1.6s cubic-bezier(.25,.1,.25,1) .25s,filter 1.8s cubic-bezier(.2,.7,.2,1) .25s,transform 2s cubic-bezier(.2,.7,.2,1) .25s}
.fam.lit{opacity:1;filter:none;animation:manifest 1.6s cubic-bezier(.2,.7,.2,1);transition:transform .6s ease}
.cholding .fam.lit{transform:scale(.94);transition:transform 3s cubic-bezier(.5,0,.8,.5)}
.cholding .fam.alive img{animation-play-state:paused}
@keyframes manifest{0%{opacity:0;filter:blur(10px) brightness(2.2);transform:scale(.82)}55%{opacity:1;filter:blur(1px) brightness(1.5)}100%{opacity:1;filter:blur(0) brightness(1);transform:scale(1)}}
.fam img{transform-origin:50% 50%}
.fam.alive img{animation:fbreathe 4.6s ease-in-out 1.6s infinite;filter:drop-shadow(0 0 7px rgba(158,216,232,.2))}
@keyframes fbreathe{0%,100%{transform:scale(.985);filter:drop-shadow(0 0 7px rgba(158,216,232,.2))}50%{transform:scale(1.04);filter:drop-shadow(0 0 16px rgba(158,216,232,.45))}}
.fam.fold{opacity:0;filter:blur(9px);transform:scale(.95);animation:withdraw .85s cubic-bezier(.5,0,.8,.45) forwards}
@keyframes withdraw{0%{opacity:1;transform:scale(.94);filter:brightness(1) blur(0)}30%{opacity:1;filter:brightness(1.5) blur(.6px)}100%{opacity:0;transform:scale(.3);filter:brightness(2) blur(7px)}}
/* después de la pausa, la silueta tenue vuelve despacio, como al abrir la pantalla */
.fam.back{animation:ghostin 1.9s cubic-bezier(.25,.1,.25,1) .3s both}
@keyframes ghostin{from{opacity:0;filter:blur(9px);transform:scale(.95)}to{opacity:.2;filter:blur(0);transform:none}}

/* la ficha */
.swap-a{animation:swapa .5s cubic-bezier(.2,.7,.2,1)}
.swap-b{animation:swapb .5s cubic-bezier(.2,.7,.2,1)}
@keyframes swapa{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes swapb{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.rules{transform:translateY(100%);transition:transform .55s cubic-bezier(.2,.7,.2,1)}
.rules.open{transform:none}

@media (prefers-reduced-motion: reduce){
  .arrive,.th1,.th2,.drawn,.fade,.sweep,.twinkle,.node.idle .dot,.node.next .guide,.fam.lit,.fam.alive img,.summoned .sring,.summoned .swv1,.summoned .swv2,.summoned .ssonar,.swap-a,.swap-b,.sealed .ripple,.dismissed .close,.dismissed .spark,.fam.fold,.fam.back,.sealed .ringlit,.cholding .bw1,.cholding .bw2,.cholding .inhale{animation:none}
  .bshrink{transition:none !important}
  .mote{animation:none;display:none}.sealed .inkrise circle{animation:none}.thread,.drawn,.enso-paint{stroke-dashoffset:0}.enso-paint,.bezel path,.arcs .a1,.arcs .a2{animation:none}.fade{opacity:1}.fam{transition:none}
  .node.next .guide{opacity:.8}
  .rules{transition:none}
}
</style>
</helmet>

      <span class="dot" style="width: 9px; height: 9px; border-radius: 50%; background: {{n.dot}}; box-shadow: {{n.glow}}; animation-delay: {{n.blink}}"></span>
    </button>
    <span class="fade" style="position: absolute; left: {{n.lx}}; top: {{n.ly}}; width: 90px; margin-left: -45px; text-align: center; font-size: 13px; color: {{n.lc}}; transition: color .4s; pointer-events: none; animation-delay: {{n.delay}}">{{n.name}}</span>
  </sc-for>

  <section class="fade" aria-live="polite" style="position: absolute; left: 28px; right: 28px; top: 500px; animation-delay: 2.2s; pointer-events: none">
    <div class="{{swapCls}}" style="display: flex; flex-direction: column; align-items: center; text-align: center">
      <h2 style="margin: 0; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 30px; line-height: 1; color: #F1F4F7">{{f.name}}</h2>
      <p style="margin: 6px 0 0; font-size: 12px; color: {{statusColor}}">{{status}}</p>

      <div style="display: flex; justify-content: center; gap: 34px; margin-top: 14px">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 32px; line-height: 1; color: #F1F4F7">{{f.ac}}</span><span style="font-size: 11px; color: #8E9FB2">Armor class</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 32px; line-height: 1; color: #F1F4F7">{{f.hp}}</span><span style="font-size: 11px; color: #8E9FB2">Hit points</span></div>
        <div style="display: flex; flex-direction: column; align-items: center; gap: 2px"><span style="font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 32px; line-height: 1; color: #F1F4F7">{{f.init}}</span><span style="font-size: 11px; color: #8E9FB2">Initiative</span></div>
      </div>

      <div style="width: 40px; height: 1px; background: #33465C; margin: 14px 0 10px"></div>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #C3CDD8">{{f.speed}}</p>
      <p style="margin: 0; font-size: 13px; line-height: 1.5; color: #C3CDD8">{{f.senses}}</p>
      <p style="margin: 0; font-size: 12.5px; line-height: 1.5; color: #8E9FB2">{{f.skills}}</p>

      <div style="display: flex; flex-direction: column; gap: 6px; margin-top: 10px">
        <sc-for list="{{f.traits}}" as="t" hint-placeholder-count="1">
          <p style="margin: 0; font-size: 12.5px; line-height: 1.4; color: #8E9FB2"><span style="font-family: 'Cormorant Garamond', serif; font-style: italic; font-weight: 500; font-size: 17px; color: #F1F4F7">{{t.name}}.</span> {{t.text}}</p>
        </sc-for>
      </div>
    </div>
  </section>

  <button onClick="{{openRules}}" onPointerDown="{{stop}}" class="fade" style="position: absolute; left: 0; right: 0; bottom: 14px; margin: 0 auto; width: 200px; height: 40px; font-size: 12.5px; color: #9ED8E8; animation-delay: 2.4s">How Find Familiar works</button>

  <div class="rules {{rulesCls}}" onClick="{{closeRules}}" onPointerDown="{{stop}}" role="dialog" aria-label="How Find Familiar works" style="position: absolute; left: 0; right: 0; bottom: 0; height: 430px; padding: 30px 32px 24px; background: linear-gradient(180deg, rgba(12,21,38,.97) 0%, #0A1119 100%); border-top: 1px solid rgba(241,244,247,.25); cursor: pointer">
    <h3 style="margin: 0 0 16px; text-align: center; font-family: 'Cormorant Garamond', serif; font-weight: 500; font-size: 24px; color: #F1F4F7">Find Familiar</h3>
    <div style="display: flex; flex-direction: column; gap: 12px; font-size: 13px; line-height: 1.45; color: #C3CDD8">
      <p style="margin: 0"><span style="color: #F1F4F7">Telepathy.</span> You talk to it in your mind while it is within 100 feet.</p>
      <p style="margin: 0"><span style="color: #F1F4F7">Its senses.</span> As a bonus action, you see and hear through it until the start of your next turn.</p>
      <p style="margin: 0"><span style="color: #F1F4F7">Touch spells.</span> It can deliver a touch spell you cast, within 100 feet, using its reaction.</p>
      <p style="margin: 0"><span style="color: #F1F4F7">In combat.</span> It rolls its own initiative and acts on its turn. It can't attack.</p>
      <p style="margin: 0"><span style="color: #F1F4F7">Pocket dimension.</span> A magic action sends it away; another brings it back within 30 feet.</p>
      <p style="margin: 0"><span style="color: #F1F4F7">New form.</span> Casting the spell again changes its form. Only one familiar at a time.</p>
    </div>
  </div>
</div>
</template>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
// Vibración de cada momento (ms; los arrays alternan vibrar / pausa).
const HAPTIC = {
  touch: 12,                       // tocar una punta
  vertex: 10,                      // cada punta correcta del trazo
  fizzle: [20, 40, 20],            // fallo
  summon: [15, 60, 25, 60, 60],    // cerrar la estrella
  holdPulse: 12,                   // pulsos mientras se mantiene el centro para despedir
  holdAt: [1000, 1800, 2400, 2800],// cuándo suenan esos pulsos (ms desde que se apoya)
  dismiss: 40                      // al soltarse el familiar
};

class Component extends DCLogic {
  constructor(props) {
    super(props);
    let active = '';
    try { active = localStorage.getItem('morrigan:familiar') || ''; } catch (e) {}
    if (['owl', 'raven', 'cat', 'octopus', 'spider'].indexOf(active) < 0) active = '';
    this.state = { sel: active || 'owl', active, path: [], live: null, hint: false, fx: '', chold: false, fold: false, rules: false, swap: 0 };
  }
  componentWillUnmount() { clearTimeout(this._hint); clearTimeout(this._fx); clearTimeout(this._ch); clearTimeout(this._fd); clearTimeout(this._fg); clearTimeout(this._bk); clearTimeout(this._fz); this.stopHoldPulses(); }
  buzz(p) { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} }
  stopHoldPulses() { (this._hp || []).forEach(clearTimeout); this._hp = []; }

  renderVals() {
    const FAM = {
      owl: { name: 'Owl', ac: 11, hp: 1, init: '+1', speed: 'Walk 5 ft, fly 60 ft', senses: 'Darkvision 120 ft. Passive Perception 15', skills: 'Perception +5, Stealth +5',
        traits: [{ name: 'Flyby', text: "It doesn't provoke opportunity attacks when it flies out of an enemy's reach." }] },
      raven: { name: 'Raven', ac: 12, hp: 2, init: '+2', speed: 'Walk 10 ft, fly 50 ft', senses: 'No darkvision. Passive Perception 13', skills: 'Perception +3',
        traits: [{ name: 'Mimicry', text: 'It mimics simple sounds it has heard. A DC 10 Wisdom (Insight) check reveals the imitation.' }] },
      cat: { name: 'Cat', ac: 12, hp: 2, init: '+2', speed: 'Walk 40 ft, climb 40 ft', senses: 'Darkvision 60 ft. Passive Perception 13', skills: 'Perception +3, Stealth +4',
        traits: [{ name: 'Jumper', text: 'It uses Dexterity instead of Strength to work out how far it jumps.' }] },
      octopus: { name: 'Octopus', ac: 12, hp: 3, init: '+2', speed: 'Walk 5 ft, swim 30 ft', senses: 'Darkvision 30 ft. Passive Perception 12', skills: 'Perception +2, Stealth +6',
        traits: [{ name: 'Compression', text: 'Fits through 1 inch gaps.' },
                 { name: 'Water breathing', text: 'Breathes only underwater.' },
                 { name: 'Ink cloud', text: 'Once a day underwater: ink fills 5 ft, it swims off.' }] },
      spider: { name: 'Spider', ac: 12, hp: 1, init: '+2', speed: 'Walk 20 ft, climb 20 ft', senses: 'Darkvision 30 ft. Passive Perception 10', skills: 'Stealth +4',
        traits: [{ name: 'Spider climb', text: 'It climbs difficult surfaces, even along ceilings, without checks.' },
                 { name: 'Web walker', text: 'Webs never slow it, and it knows where anything touching its web is.' }] }
    };
    const ORDER = ['owl', 'raven', 'cat', 'octopus', 'spider'];
    const POS = {"owl": [119.8, 214.4], "raven": [270.2, 214.4], "cat": [316.7, 357.6], "octopus": [195.0, 446.0], "spider": [73.3, 357.6]};
    const CX = 195, CY = 318;
    const LBL = { owl: [-27, -37], raven: [27, -37], cat: [40, 36], octopus: [0, 37], spider: [-40, 36] };
    const SNAP = 28, HINT_MS = 900, DISMISS_MS = 3000;

    const st = this.state || {};
    const sel = st.sel || 'owl';
    const active = st.active || '';
    const path = st.path || [];

    // la estrella: desde la punta del familiar, saltando una cada vez, y de vuelta al inicio
    const seq = (start) => { const s = ORDER.indexOf(start); return [0, 2, 4, 1, 3, 0].map((k) => ORDER[(s + k) % 5]); };
    const expected = path.length ? seq(path[0])[path.length] : null;

    const toLocal = (e) => {
      const r = this._root.getBoundingClientRect();
      return [(e.clientX - r.left) * 390 / r.width, (e.clientY - r.top) * 844 / r.height];
    };
    const near = ([x, y]) => ORDER.find((id) => Math.hypot(POS[id][0] - x, POS[id][1] - y) < SNAP);
    const armHint = () => { clearTimeout(this._hint); this._hint = setTimeout(() => this.setState({ hint: true }), HINT_MS); };
    const fx = (name, ms) => { this.setState({ fx: name }); clearTimeout(this._fx); this._fx = setTimeout(() => this.setState({ fx: '' }), ms); };
    const select = (id) => { if (id !== this.state.sel) this.setState({ sel: id, swap: (this.state.swap || 0) + 1 }); };

    const fizzle = () => {
      clearTimeout(this._hint);
      const p = this.state.path || [];
      if (p.length > 1) { this.buzz(HAPTIC.fizzle); this.setState({ live: null, hint: false, frozen: p }); fx('fizzle', 700); clearTimeout(this._fz); this._fz = setTimeout(() => this.setState({ frozen: null }), 700); }
      this.setState({ path: [], live: null, hint: false });
    };
    const seal = (id) => {
      clearTimeout(this._hint);
      try { localStorage.setItem('morrigan:familiar', id); } catch (e) {}
      this.buzz(HAPTIC.summon);
      const full = seq(id);
      clearTimeout(this._fd); clearTimeout(this._fg); clearTimeout(this._bk);
      this.setState({ active: id, sel: id, path: [], live: null, hint: false, frozen: full, fold: false, back: '', swap: (this.state.swap || 0) + 1 });
      fx('sealed', 1800);
      clearTimeout(this._fz);
      this._fz = setTimeout(() => this.setState({ frozen: null }), 1800);
    };

    const pDown = (e) => {
      if (e.button !== undefined && e.button !== 0) return;
      if (this.state.rules) return;
      this._root = e.currentTarget;
      const pt = toLocal(e);
      const id = near(pt);
      if (id) {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        this.buzz(HAPTIC.touch);
        select(id);
        // Un trazo nuevo reemplaza al que quedaba congelado (fallo o invocación recientes).
        clearTimeout(this._fz);
        this.setState({ path: [id], live: pt, hint: false, frozen: null });
        armHint();
        return;
      }
      if (Math.hypot(pt[0] - CX, pt[1] - CY) < 62 && this.state.active && !this.state.fold) {
        try { e.currentTarget.setPointerCapture(e.pointerId); } catch (err) {}
        this.setState({ chold: true });
        clearTimeout(this._ch);
        this.stopHoldPulses();
        this._hp = HAPTIC.holdAt.map((ms) => setTimeout(() => this.buzz(HAPTIC.holdPulse), ms));
        this._ch = setTimeout(() => {
          this.stopHoldPulses();
          this.buzz(HAPTIC.dismiss);
          try { localStorage.setItem('morrigan:familiar', ''); } catch (err) {}
          this.setState({ chold: false, fold: true });
          fx('dismissed', 1700);
          clearTimeout(this._fd); clearTimeout(this._fg); clearTimeout(this._bk);
          // Se va (0,9 s), el círculo queda vacío, y recién después vuelve la silueta tenue.
          const gone = this.state.active;
          this._fd = setTimeout(() => this.setState({ active: '' }), 900);
          this._fg = setTimeout(() => {
            this.setState({ fold: false, back: gone });
            this._bk = setTimeout(() => this.setState({ back: '' }), 2400);
          }, 1900);
        }, DISMISS_MS);
      }
    };
    const pMove = (e) => {
      const p = this.state.path || [];
      if (!p.length) return;
      const pt = toLocal(e);
      const need = seq(p[0])[p.length];
      const id = near(pt);
      if (id && id === need) {
        const np = p.concat(id);
        if (np.length === 6) { seal(p[0]); return; }
        this.buzz(HAPTIC.vertex);
        this.setState({ path: np, live: pt, hint: false });
        armHint();
        return;
      }
      if (id && id !== p[p.length - 1]) { fizzle(); return; }
      this.setState({ live: pt });
    };
    const pUp = () => {
      if (this.state.chold) { clearTimeout(this._ch); this.stopHoldPulses(); this.setState({ chold: false }); return; }
      const p = this.state.path || [];
      if (!p.length) return;
      if (p.length === 1) { clearTimeout(this._hint); this.setState({ path: [], live: null, hint: false }); return; }
      fizzle();
    };

    // el trazo: segmentos fijos más el tramo que sigue al dedo
    const shown = st.frozen || path;
    let traceD = '';
    if (shown.length) {
      traceD = 'M' + shown.map((id) => POS[id][0] + ' ' + POS[id][1]).join(' L');
      if (!st.frozen && st.live && path.length) traceD += ' L' + st.live[0].toFixed(1) + ' ' + st.live[1].toFixed(1);
    } else traceD = 'M0 0';

    const nodes = ORDER.map((id, k) => {
      const [x, y] = POS[id];
      const isSel = id === sel, isOn = id === active;
      const isHit = path.includes(id) || (st.frozen || []).includes(id) && st.fx === 'sealed';
      const isNext = !!st.hint && id === expected;
      return {
        x: x + 'px', y: y + 'px', lx: (x + LBL[id][0]) + 'px', ly: (y + LBL[id][1] - 9) + 'px',
        name: FAM[id].name,
        cls: [isHit ? 'hit' : '', isNext ? 'next' : '', !isHit ? 'idle' : ''].join(' '),
        dot: isHit ? '#9ED8E8' : '#5F7186',
        glow: isHit ? '0 0 12px rgba(126,200,226,.95)' : 'none',
        lc: '#8E9FB2',
        delay: (2 + k * 0.08) + 's', blink: (2.5 + k * 2.3) + 's',
        aria: FAM[id].name + (isOn ? ', summoned' : '') + '. Enter to read, Shift and Enter to summon',
        key: (e) => {
          if (e.key !== 'Enter' && e.key !== ' ') return;
          e.preventDefault();
          if (e.shiftKey) seal(id); else select(id);
        }
      };
    });

    const con = {};
    ORDER.forEach((id) => {
      const isSel = id === sel, isOn = id === active;
      con[id] = [isSel ? 'show' : '', isSel && isOn ? 'lit alive' : '', isSel && st.fold ? 'fold' : '', isSel && st.back === id ? 'back' : ''].join(' ');
    });

    const f = FAM[sel];
    const isOn = sel === active;
    return {
      rootCls: [st.fx || '', st.chold ? 'cholding' : '', (path.length && !st.frozen) ? 'tracing' : '', (active && sel === active && !st.fold) ? 'summoned' : ''].join(' '),
      pDown, pMove, pUp, pCancel: pUp, noMenu: (e) => e.preventDefault(), stop: (e) => { if (e.stopPropagation) e.stopPropagation(); },
      traceD, traceOp: shown.length ? '1' : '0', traceBleed: shown.length ? '.08' : '0',
      starD: shown.length ? 'M' + seq(shown[0]).map((id) => POS[id][0] + ' ' + POS[id][1]).join(' L') : 'M195 318',
      starOp: (path.length && !st.frozen) ? '.32' : (st.fx === 'sealed' ? '1' : '0'),
      nodes, con,
      f: { ...f, skills: f.skills || ' ' },
      status: isOn ? 'Summoned' : '\u00A0',
      statusColor: isOn ? '#9ED8E8' : '#5F7186',
      swapCls: (st.swap || 0) % 2 ? 'swap-a' : 'swap-b',
      rulesCls: st.rules ? 'open' : '',
      openRules: () => this.setState({ rules: true }),
      closeRules: () => this.setState({ rules: false })
    };
  }
}
</script>
</body>
