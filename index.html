<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#C3CDD8}a:hover{color:#F1F4F7}

.draw{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset 1.6s cubic-bezier(.6,.05,.2,1)}
.awake .draw{stroke-dashoffset:0}
.fade{opacity:0;transition:opacity .9s ease}
.awake .fade{opacity:1}

.spin{transform-origin:195px 195px}
.awake .spin-a{animation:turn 160s linear infinite}
.awake .spin-b{animation:turn 240s linear infinite reverse}
@keyframes turn{to{transform:rotate(360deg)}}

.token{transition:transform .9s cubic-bezier(.2,.7,.2,1),border-color .9s}
.token img{filter:grayscale(1) brightness(.7);transition:filter 1.2s ease}
.awake .token img{filter:grayscale(.15) brightness(1)}
.awake .token{border-color:rgba(241,244,247,.85)}
/* apagada pero atenta: anillo que ondula, ondas que respiran, el ojo */
.dorm{opacity:0;transition:opacity .7s ease;pointer-events:none}
.sleep .dorm{opacity:1}
.breath{transform-origin:195px 195px}
.sleep .breath{animation:breath 4.6s ease-in-out infinite}
@keyframes breath{0%,100%{transform:scale(.97);opacity:.4}50%{transform:scale(1.03);opacity:.85}}
.wavy{fill:none;stroke:#DDE6EE;stroke-width:1;transform-origin:195px 195px}
.sleep .wv1{animation:turn 26s linear infinite}
.sleep .wv2{animation:turn 33s linear infinite reverse}
.sonar{fill:none;stroke:#DDE6EE;opacity:0}
.sleep .sonar{animation:sonar 4.6s cubic-bezier(.2,.6,.3,1) infinite}
@keyframes sonar{0%{r:80px;opacity:.5;stroke-width:1.1}48%{r:205px;opacity:0;stroke-width:.3}100%{r:205px;opacity:0}}
.reveal{fill:none;stroke:#4A6078;stroke-width:1;opacity:0}
.sleep .reveal{animation:reveal 4.6s ease-in-out infinite}
@keyframes reveal{0%,9%{opacity:0}21%{opacity:.6}36%,100%{opacity:0}}
.tw-dorm{fill:#B0D7DE;opacity:0}
.sleep .tw-dorm{animation:twinkle-dim 9s ease-in-out infinite}
@keyframes twinkle-dim{0%,100%{opacity:0}50%{opacity:.35}}
.eye{position:absolute;left:92px;top:66px;width:20px;height:20px;border-radius:50%;background:radial-gradient(circle,rgba(255,220,227,.95) 0%,rgba(228,154,168,.55) 32%,rgba(228,154,168,0) 70%);mix-blend-mode:screen;opacity:0;pointer-events:none}
.sleep .eye{animation:eye 7.5s ease-in-out 2.2s infinite}
@keyframes eye{0%,80%,100%{opacity:0;transform:scale(.4)}86%{opacity:1;transform:scale(1.15)}93%{opacity:0;transform:scale(.8)}}
.ripple{fill:none;stroke:#F1F4F7;opacity:0}
.awake .ripple{animation:ripple 1.6s cubic-bezier(.2,.7,.2,1) forwards}
.awake .ripple.r2{animation-delay:.18s}
@keyframes ripple{0%{r:68px;opacity:.8;stroke-width:1.4}100%{r:190px;opacity:0;stroke-width:.3}}

.node{opacity:0;transform:scale(.4);pointer-events:none;transition:opacity .6s ease,transform .6s cubic-bezier(.2,.7,.2,1)}
.awake .node{opacity:1;transform:none;pointer-events:auto}
.node .dot{transition:background .3s,box-shadow .3s,transform .3s}
.node:hover .dot,.node:focus-visible .dot{background:#F1F4F7}
.label{opacity:0;transition:opacity .6s ease}
.awake .label{opacity:1}

.ltr{opacity:0;transition:opacity .35s ease}
.awake .ltr{opacity:.4}
.mark{opacity:0;transition:opacity .35s ease}
.awake .mark{opacity:.6}
.ray{stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .55s cubic-bezier(.5,0,.2,1);filter:drop-shadow(0 0 4px rgba(126,200,226,.9))}

/* esgrima: huellas y cuerdas */
.feet{opacity:0;transition:opacity 1.4s ease 1.9s}
.awake .feet{opacity:1}
.feet path{fill:none;stroke:#2E4157;stroke-width:.9}

/* magia: intersecciones que titilan */
.twinkle{fill:#B0D7DE;opacity:0}
.awake .twinkle{animation-name:twinkle;animation-timing-function:ease-in-out;animation-iteration-count:infinite}
@keyframes twinkle{0%,100%{opacity:.06}50%{opacity:.8}}

/* luz: destellos que recorren las líneas */
.sweep{fill:none;stroke:#EAF4F6;stroke-width:1.4;stroke-linecap:round;stroke-dasharray:.04 .96;stroke-dashoffset:1;opacity:0;filter:drop-shadow(0 0 3px rgba(176,215,222,.9))}
.awake .sweep-a{animation:sweep 9s ease-in-out 3.2s infinite}
.awake .sweep-b{animation:sweep-rev 13s ease-in-out 6.5s infinite}
@keyframes sweep{0%{stroke-dashoffset:1;opacity:0}4%{opacity:.85}30%{opacity:.85}34%{stroke-dashoffset:0;opacity:0}100%{stroke-dashoffset:0;opacity:0}}
@keyframes sweep-rev{0%{stroke-dashoffset:0;opacity:0}4%{opacity:.6}24%{opacity:.6}28%{stroke-dashoffset:1;opacity:0}100%{stroke-dashoffset:1;opacity:0}}

/* camino azul arcano */
.blade{opacity:0;transition:opacity .45s ease .3s}
.spark{opacity:0;fill:#F4FCFE;filter:drop-shadow(0 0 5px rgba(158,216,232,1))}
.flare{fill:none;stroke:#B0D7DE;opacity:0}
.lit-story .blade-story,.lit-character .blade-character,.lit-unwritten .blade-unwritten,.lit-familiars .blade-familiars{opacity:1}
.lit-story .spark-story{animation:spark-n .6s cubic-bezier(.5,0,.2,1) forwards}
.lit-character .spark-character{animation:spark-e .6s cubic-bezier(.5,0,.2,1) forwards}
.lit-unwritten .spark-unwritten{animation:spark-s .6s cubic-bezier(.5,0,.2,1) forwards}
.lit-familiars .spark-familiars{animation:spark-w .6s cubic-bezier(.5,0,.2,1) forwards}
@keyframes spark-n{0%{opacity:1;transform:translate(0,0)}85%{opacity:1}100%{opacity:0;transform:translate(0,-73px)}}
@keyframes spark-e{0%{opacity:1;transform:translate(0,0)}85%{opacity:1}100%{opacity:0;transform:translate(73px,0)}}
@keyframes spark-s{0%{opacity:1;transform:translate(0,0)}85%{opacity:1}100%{opacity:0;transform:translate(0,73px)}}
@keyframes spark-w{0%{opacity:1;transform:translate(0,0)}85%{opacity:1}100%{opacity:0;transform:translate(-73px,0)}}
.lit-story .f-story,.lit-character .f-character,.lit-unwritten .f-unwritten,.lit-familiars .f-familiars{animation:flare .9s ease-out .5s forwards}
@keyframes flare{0%{r:6px;opacity:.95;stroke-width:1.6}100%{r:32px;opacity:0;stroke-width:.4}}
.ltr text{transition:fill .25s ease}
.mark{transition:opacity .35s ease,stroke .25s ease}

.lit .node,.lit .label{opacity:.3;transition-delay:0s !important}
.lit-story .ray-story,.lit-character .ray-character,.lit-unwritten .ray-unwritten,.lit-familiars .ray-familiars{stroke-dashoffset:0}
.lit-story .l-story,.lit-character .l-character,.lit-unwritten .l-unwritten,.lit-familiars .l-familiars{opacity:1}
.lit-story .l-story text,.lit-character .l-character text,.lit-unwritten .l-unwritten text,.lit-familiars .l-familiars text{fill:#B0D7DE}
.lit-story .mk-story,.lit-character .mk-character,.lit-unwritten .mk-unwritten,.lit-familiars .mk-familiars{opacity:1;stroke:#B0D7DE}
.lit-story .n-story,.lit-character .n-character,.lit-unwritten .n-unwritten,.lit-familiars .n-familiars{opacity:1}
.lit-story .n-story .dot,.lit-character .n-character .dot,.lit-unwritten .n-unwritten .dot,.lit-familiars .n-familiars .dot{background:#9ED8E8;border-color:#D8F1F7 !important;transform:scale(1.55);box-shadow:0 0 0 6px rgba(158,216,232,.16),0 0 28px rgba(126,200,226,.95);transition-delay:.45s}
.lit-story .t-story,.lit-character .t-character,.lit-unwritten .t-unwritten,.lit-familiars .t-familiars{opacity:1;color:#B0D7DE !important}

/* vuelve despierta: sin repetir la apertura */
.instant .draw,.instant .fade,.instant .node,.instant .label,.instant .ltr,.instant .mark,.instant .feet,.instant .token,.instant .token img,.instant .title,.instant .dorm{transition:none !important}
.restored .ripple{animation:none}
/* dormirla: mantener apretado el token, el círculo se apaga de afuera hacia adentro */
.token{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.token img{-webkit-user-drag:none;pointer-events:none}
.dusk{fill:none;stroke:#070D14;stroke-width:440;r:420px;opacity:0;filter:blur(14px);pointer-events:none;transition:r .45s cubic-bezier(.2,.7,.2,1),opacity .45s ease}
.holding .dusk{r:288px;opacity:.84;transition:r 1.4s cubic-bezier(.45,0,.55,1),opacity .5s ease}
.holding .token{transform:scale(.96);transition:transform 1.4s cubic-bezier(.45,0,.55,1),border-color 1.4s}
.holding .token img{filter:grayscale(.7) brightness(.78);transition:filter 1.4s ease}
.holding .node,.holding .label{opacity:.18;transition:opacity 1.1s ease .15s !important}
.title{transition:opacity 1.2s ease,letter-spacing 1.6s cubic-bezier(.2,.7,.2,1)}
.sleep .title{opacity:.35;letter-spacing:.08em}
.awake .title{opacity:1;letter-spacing:0}

@media (prefers-reduced-motion: reduce){
  .draw,.ray,.node,.label,.ltr,.mark,.fade,.token img,.title{transition:none}
  .awake .spin-a,.awake .spin-b,.awake .ripple,.awake .twinkle,.awake .sweep-a,.awake .sweep-b{animation:none}
  .sleep .breath,.sleep .wv1,.sleep .wv2,.sleep .sonar,.sleep .reveal,.sleep .tw-dorm,.sleep .eye{animation:none}
  .sleep .breath{opacity:.6}
  .awake .twinkle{opacity:.4}
}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    let restored = false;
    try { restored = sessionStorage.getItem('morrigan:awake') === '1'; } catch (e) {}
    this.state = { phase: restored ? 'awake' : 'sleep', lit: null, instant: restored, restored, holding: false };
    if (restored) this._i = setTimeout(() => { if (this.state.instant) this.setState({ instant: false }); }, 400);
  }
  componentWillUnmount() { clearTimeout(this._t); clearTimeout(this._r); clearTimeout(this._i); clearTimeout(this._hs); clearTimeout(this._h); }
  renderVals() {
    const st = this.state || {};
    const phase = st.phase || 'sleep';
    const lit = st.lit;
    const LAUGH = 'assets/cackle.webm';
    const go = {};
    ['story', 'character', 'unwritten', 'familiars'].forEach((k) => {
      go[k] = (e) => {
        if (this._pass) { this._pass = false; return; }
        if (e && e.preventDefault) e.preventDefault();
        if (phase !== 'awake' || this.state.lit) return;
        const a = e && e.currentTarget;
        this.setState({ lit: k, instant: false });
        clearTimeout(this._t);
        this._t = setTimeout(() => {
          const real = a && a.getAttribute && a.getAttribute('href') !== '#';
          if (real) { this._pass = true; try { a.click(); } catch (err) {} }
          this._r = setTimeout(() => this.setState({ lit: null }), real ? 400 : 200);
        }, 1050);
      };
    });
    let cls = phase === 'awake' ? 'awake' : 'sleep';
    if (lit) cls += ' lit lit-' + lit;
    if (st.instant) cls += ' instant';
    if (st.restored) cls += ' restored';
    if (st.holding) cls += ' holding';
    const laugh = () => { try { const s = new Audio(LAUGH); s.volume = 0.9; const p = s.play(); if (p && p.catch) p.catch(() => {}); } catch (err) {} };
    const HOLD_DELAY = 220, HOLD_TIME = 1400;
    return {
      rootCls: cls,
      go,
      tokenLabel: phase === 'awake' ? 'Hear Morrigan laugh. Hold to let her sleep' : 'Touch the token to wake the circle',
      noMenu: (e) => { if (e && e.preventDefault) e.preventDefault(); },
      tap: () => {
        if (this._swallow) { this._swallow = false; return; }
        if (this.state.lit) return;
        laugh();
        if (phase === 'awake') return;
        try { localStorage.setItem('morrigan:session', String(Date.now())); } catch (err) {}
        try { sessionStorage.setItem('morrigan:awake', '1'); } catch (err) {}
        this.setState({ phase: 'awake', instant: false, restored: false });
      },
      hDown: (e) => {
        this._swallow = false;
        if (phase !== 'awake' || this.state.lit) return;
        if (e && e.button != null && e.button !== 0) return;
        clearTimeout(this._hs); clearTimeout(this._h);
        this._hs = setTimeout(() => this.setState({ holding: true, instant: false }), HOLD_DELAY);
        this._h = setTimeout(() => {
          this._swallow = true;
          try { if (navigator.vibrate) navigator.vibrate(28); } catch (err) {}
          try { sessionStorage.removeItem('morrigan:awake'); } catch (err) {}
          clearTimeout(this._t); clearTimeout(this._r);
          this.setState({ phase: 'sleep', holding: false, lit: null, restored: false, instant: false });
        }, HOLD_DELAY + HOLD_TIME);
      },
      hUp: () => {
        clearTimeout(this._hs); clearTimeout(this._h);
        if (this.state.holding) { this._swallow = true; this.setState({ holding: false }); }
      }
    };
  }
}
</script>
