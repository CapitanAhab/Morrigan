<style>
body{margin:0}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
a{color:#C3CDD8}a:hover{color:#F1F4F7}

/* A alimenta C: el hilo baja, recorre el borde y la carta se enciende */
.arrive{animation:arrive .9s cubic-bezier(.2,.7,.2,1) both}
@keyframes arrive{from{opacity:0;transform:translateY(-28px)}to{opacity:1;transform:none}}
.thread{fill:none;stroke:#9ED8E8;stroke-width:1.2;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;filter:drop-shadow(0 0 3px rgba(126,200,226,.8))}
@keyframes draw{to{stroke-dashoffset:0}}
.th1{animation:draw .5s cubic-bezier(.5,0,.2,1) .1s forwards}
.th2{animation:draw .45s cubic-bezier(.5,0,.2,1) .55s forwards}
.frame{animation:frame 1.9s cubic-bezier(.45,0,.25,1) .95s forwards}
@keyframes frame{0%{stroke-dashoffset:1;opacity:1}50%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
.cardin{opacity:0;animation:cardin 1.1s cubic-bezier(.2,.7,.2,1) 1.6s forwards}
@keyframes cardin{from{opacity:0;transform:scale(.985)}to{opacity:1;transform:none}}
.back-node .bdot{transition:transform .3s,box-shadow .3s}
.back-node:hover .bdot,.back-node:focus-visible .bdot{transform:scale(1.4);box-shadow:0 0 0 5px rgba(158,216,232,.14),0 0 16px rgba(126,200,226,.9)}

/* la niebla de Barovia */
.mist{position:absolute;pointer-events:none;opacity:0;animation:mistin 3.5s ease .3s forwards}
@keyframes mistin{to{opacity:1}}
.fog{position:absolute;will-change:transform}
.fog i{position:absolute;inset:0;display:block;animation:breathe 14s ease-in-out infinite}
.drift-a{animation:drift 52s ease-in-out infinite alternate}
.drift-b{animation:drift 68s ease-in-out infinite alternate-reverse}
.drift-c{animation:drift 84s ease-in-out infinite alternate}
@keyframes drift{from{transform:translateX(-140px)}to{transform:translateX(140px)}}
@keyframes breathe{0%,100%{opacity:.7}50%{opacity:1}}

/* la carta flota */
.floaty{animation:float 6.5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}

/* tinta que se desprende de la capa */
.ink{position:absolute;border-radius:50%;background:#02050A;box-shadow:0 0 0 .6px rgba(158,190,222,.28),0 0 6px rgba(2,5,10,.9);opacity:0;animation:ink 6s ease-in-out infinite}
@keyframes ink{0%{opacity:0;transform:translate(0,0) scale(.5)}15%{opacity:1}70%{opacity:.9}100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}}

/* destello que recorre el borde al darla vuelta */
.glint rect{fill:none;stroke:#EAF4F6;stroke-width:2;stroke-linecap:round;stroke-dasharray:.14 .86;stroke-dashoffset:1;filter:drop-shadow(0 0 4px rgba(158,216,232,1));animation:glint 1.2s cubic-bezier(.4,0,.2,1) .2s forwards;opacity:0}
@keyframes glint{0%{stroke-dashoffset:1;opacity:0}10%{opacity:1}85%{opacity:1}100%{stroke-dashoffset:-.02;opacity:0}}

/* el dorso se escribe línea por línea */
.ln{opacity:0}
.back-on .ln{animation:ln .6s cubic-bezier(.2,.7,.2,1) both}
.back-on .ln:nth-child(1){animation-delay:.45s}
.back-on .ln:nth-child(2){animation-delay:.7s}
.back-on .ln:nth-child(3){animation-delay:1s}
.back-on .ln:nth-child(4){animation-delay:.84s}
.back-on .ln:nth-child(5){animation-delay:.96s}
.back-on .ln:nth-child(6){animation-delay:1.08s}
.back-on .ln:nth-child(7){animation-delay:1.2s}
@keyframes ln{from{opacity:0;transform:translateY(5px);filter:blur(2px)}to{opacity:1;transform:none;filter:none}}
.drop{transform-origin:top;transform:scaleY(0)}
.back-on .drop{animation:drop .6s cubic-bezier(.2,.7,.2,1) both}
.back-on .ln:nth-child(2) .drop{animation-delay:.7s}
.back-on .ln:nth-child(3) .drop{animation-delay:1s}
@keyframes drop{to{transform:scaleY(1)}}

@media (prefers-reduced-motion: reduce){
  .floaty,.ink,.glint rect,.arrive,.th1,.th2,.frame,.cardin,.fog,.fog i,.mist{animation:none}
  .mist{opacity:1}
  .thread{stroke-dashoffset:0}.frame{opacity:0}.cardin{opacity:1}
  .back-on .ln,.back-on .drop{animation:none;opacity:1;transform:none}
  .tilt{transition:none !important}
}
</style>

<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { flipped: false, session: null, tx: 0, ty: 0, live: false, glint: 0 };
  }
  componentWillUnmount() { clearTimeout(this._g); cancelAnimationFrame(this._raf); if (this._gyro) window.removeEventListener('deviceorientation', this._gyro); if (this._vis) document.removeEventListener('visibilitychange', this._vis); }
  // En el celu, la carta sigue la inclinación del teléfono. La posición de reposo se adapta sola.
  listenGyro() {
    if (this._gyro || typeof window === 'undefined' || !('DeviceOrientationEvent' in window)) return;
    this._gyro = (e) => {
      if (e.beta == null || e.gamma == null || this._touching) return;
      if (this._b0 == null) { this._b0 = e.beta; this._g0 = e.gamma; }
      this._b0 += (e.beta - this._b0) * 0.006; this._g0 += (e.gamma - this._g0) * 0.006;
      const nx = Math.max(-1, Math.min(1, (e.gamma - this._g0) / 18));
      const ny = Math.max(-1, Math.min(1, (e.beta - this._b0) / 18));
      this._next = { tx: nx, ty: ny };
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = 0; this.setState({ ...this._next, live: true }); });
    };
    window.addEventListener('deviceorientation', this._gyro);
    // Al volver de segundo plano, el reposo se toma de nuevo para que la carta no salte.
    this._vis = () => { this._b0 = null; this._g0 = null; };
    document.addEventListener('visibilitychange', this._vis);
  }
  renderVals() {
    let session = '0';
    try { session = localStorage.getItem('morrigan:session') || '0'; } catch (e) {}
    const st = this.state || {};
    const f = st.session === session ? !!st.flipped : false;
    const tx = st.tx || 0, ty = st.ty || 0;   // -1..1 respecto del centro de la carta

    this.listenGyro();
    const tiltMove = (e) => {
      if (e.pointerType !== 'mouse') this._touching = true;
      const r = e.currentTarget.getBoundingClientRect();
      const sx = r.width / 390, sy = r.height / 844;
      const nx = Math.max(-1, Math.min(1, ((e.clientX - r.left) / sx - 195) / 190));
      const ny = Math.max(-1, Math.min(1, ((e.clientY - r.top) / sy - 410) / 300));
      this._next = { tx: nx, ty: ny };
      if (this._raf) return;
      this._raf = requestAnimationFrame(() => { this._raf = 0; this.setState({ ...this._next, live: true }); });
    };
    const tiltReset = () => { this._touching = false; cancelAnimationFrame(this._raf); this._raf = 0; this.setState({ tx: 0, ty: 0, live: false }); };
    const tiltTouchEnd = (e) => { if (e.pointerType !== 'mouse') tiltReset(); };

    const flip = () => {
      this.setState({ flipped: !f, session, glint: (st.glint || 0) + 1 });
      clearTimeout(this._g);
      this._g = setTimeout(() => this.setState({ glint: 0 }), 1500);
    };

    return {
      rot: f ? '180deg' : '0deg',
      tiltX: (-ty * 6) + 'deg', tiltY: (tx * 8) + 'deg',
      tiltTrans: st.live ? 'transform .15s ease-out' : 'transform .9s cubic-bezier(.2,.7,.2,1)',
      sheenX: (-tx * 30) + '%', sheenXb: (tx * 30) + '%', sheenY: (-ty * 18) + '%',
      sheenTrans: st.live ? 'transform .15s ease-out' : 'transform .9s cubic-bezier(.2,.7,.2,1)',
      tiltMove, tiltReset, tiltTouchEnd,
      flip,
      glint: !!st.glint,
      backCls: f ? 'back-on' : '',
      flipLabel: f ? 'Turn the card to the front' : 'Turn the card over'
    };
  }
}
</script>
